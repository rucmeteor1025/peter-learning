<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🐻 Peter 学习空间</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,'PingFang SC','Noto Sans SC',sans-serif}
body{background:#f5f7fa;min-height:100vh;-webkit-tap-highlight-color:transparent}
.hdr{background:linear-gradient(135deg,#FF6B35,#FF8E53);color:#fff;padding:28px 20px 22px;text-align:center;border-radius:0 0 28px 28px}
.hdr h1{font-size:24px;margin-bottom:6px}
.hdr .date{font-size:13px;opacity:.9}
.hdr .streak{display:inline-block;margin-top:10px;background:rgba(255,255,255,.2);border-radius:20px;padding:5px 14px;font-size:14px;font-weight:600}
.wrap{max-width:520px;margin:20px auto;padding:0 16px}
.sec-title{font-size:14px;color:#999;margin:20px 4px 10px;font-weight:600;letter-spacing:1px}
.card{background:#fff;border-radius:18px;box-shadow:0 3px 14px rgba(0,0,0,.07);padding:18px;margin-bottom:14px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:transform .12s;text-decoration:none;color:inherit}
.card:active{transform:scale(.97)}
.card .ico{font-size:34px;width:60px;height:60px;display:flex;align-items:center;justify-content:center;border-radius:16px;flex-shrink:0}
.card .ico.app{background:#FFF3E0}
.card .ico.graph{background:#E8F5E9}
.card .ico.graph2{background:#EDE7F6}
.card h2{font-size:17px;font-weight:700}
.card p{font-size:12.5px;color:#888;margin-top:3px;line-height:1.5}
.card .arrow{margin-left:auto;font-size:20px;color:#ccc}
.foot{text-align:center;color:#bbb;font-size:12px;padding:24px 0 36px}
.week-cal{background:#fff;border-radius:18px;box-shadow:0 3px 14px rgba(0,0,0,.07);padding:14px 16px;margin-bottom:14px}
.wc-title{font-size:13px;color:#999;font-weight:600;margin-bottom:10px}
.wc-row{display:flex;justify-content:space-between}
.wc-cell{display:flex;flex-direction:column;align-items:center;gap:4px}
.wc-dot{width:28px;height:28px;border-radius:7px;background:#e8e8e8}
.wc-dot.l1{background:#c8e6c9}.wc-dot.l2{background:#81c784}.wc-dot.l3{background:#4caf50}
.wc-cell.today .wc-dot{outline:2px solid #FF6B35;outline-offset:1px}
.wc-wd{font-size:10px;color:#aaa}
</style>
</head>
<body>
<div class="hdr">
<h1>🐻 Peter 学习空间</h1>
<div class="date" id="dateDisplay"></div>
<div class="streak" id="streakDisplay">🌟 今天开始打卡吧</div>
</div>

<div class="wrap">
<div class="week-cal" id="weekCal"></div>

<div class="sec-title">📝 每日练习</div>
<a class="card" href="static/app.html">
<div class="ico app">✏️</div>
<div>
<h2>Peter 每日练习</h2>
<p>语文 · 数学 · 英语 · 围棋<br>每天 10 题，答对得星</p>
</div>
<div class="arrow">›</div>
</a>

<div class="sec-title">🗺️ 知识图谱（拖拽看 · 点节点学）</div>
<a class="card" href="graphs/Peter知识图谱_暑假.html">
<div class="ico graph">☀️</div>
<div>
<h2>一年级暑假 · 知识图谱</h2>
<p>语文复习 + 课外阅读 + 诗词背诵<br>数学复习 · 英语短句 · 围棋 1 段备考</p>
</div>
<div class="arrow">›</div>
</a>
<a class="card" href="graphs/Peter知识图谱_一年级下学期.html">
<div class="ico graph2">📚</div>
<div>
<h2>一年级下学期 · 知识图谱</h2>
<p>语文 + 数学 + 英语（上学期回顾）</p>
</div>
<div class="arrow">›</div>
</a>
</div>

<div class="foot">为 Peter 制作 · 一年级暑假 · 2026</div>

<script>
document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('zh-CN', {year:'numeric',month:'long',day:'numeric',weekday:'long'});
try {
	const p = JSON.parse(localStorage.getItem('peter_progress') || '{}');
	const n = p.streak || 0;
	document.getElementById('streakDisplay').textContent = n > 0 ? '🔥 已连续打卡 ' + n + ' 天' : '🌟 今天开始打卡吧';
} catch(e) {}
// 本周打卡日历（与 App 内一致）
try {
	const p = JSON.parse(localStorage.getItem('peter_progress') || '{}');
	const now = new Date();
	const dow = (now.getDay() + 6) % 7;
	const monday = new Date(now);
	monday.setDate(now.getDate() - dow);
	const today = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
	let html = '<div class="wc-title">📅 本周打卡（练得越多越绿）</div><div class="wc-row">';
	for (let i = 0; i < 7; i++) {
		const d = new Date(monday);
		d.setDate(monday.getDate() + i);
		const ds = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
		const day = p[ds] || {};
		const mods = Object.keys(day).filter(k => k !== 'streak' && k !== 'lastDate').length;
		const lvl = mods === 0 ? '' : mods === 1 ? 'l1' : mods === 2 ? 'l2' : 'l3';
		const isToday = ds === today;
		const wd = ['一', '二', '三', '四', '五', '六', '日'][i];
		html += '<div class="wc-cell' + (isToday ? ' today' : '') + '"><div class="wc-dot ' + lvl + '"></div><div class="wc-wd">' + wd + '</div></div>';
	}
	html += '</div>';
	document.getElementById('weekCal').innerHTML = html;
} catch(e) {}
</script>
</body>
</html>
