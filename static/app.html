<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🐻 Peter 学习</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'PingFang SC','Noto Sans SC',sans-serif;background:#f5f7fa;color:#333;min-height:100vh}
.header{background:linear-gradient(135deg,#FF6B35,#FF8E53);color:#fff;padding:20px;text-align:center;position:sticky;top:0;z-index:10}
.header h1{font-size:24px;margin-bottom:4px}
.header .date{font-size:14px;opacity:0.9}
.nav{display:flex;justify-content:center;gap:12px;padding:16px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.08);position:sticky;top:68px;z-index:9}
.nav button{padding:10px 20px;border:none;border-radius:20px;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.3s}
.nav .en-btn{background:#E3F2FD;color:#1976D2}
.nav .en-btn.active,.nav .en-btn:active{background:#1976D2;color:#fff}
.nav .zh-btn{background:#FFF3E0;color:#E65100}
.nav .zh-btn.active,.nav .zh-btn:active{background:#E65100;color:#fff}
.nav .math-btn{background:#E8F5E9;color:#2E7D32}
.nav .math-btn.active,.nav .math-btn:active{background:#2E7D32;color:#fff}
.nav .go-btn{background:#F3E5F5;color:#7B1FA2}
.nav .go-btn.active,.nav .go-btn:active{background:#7B1FA2;color:#fff}
.lives{font-size:18px;letter-spacing:4px;margin-bottom:10px;text-align:center}
.lives .lost{opacity:.25;filter:grayscale(1)}
.math-prompt{font-size:30px;font-weight:700;text-align:center;margin:8px 0 4px;letter-spacing:2px;color:#2E7D32}
.math-unknown{color:#FF6B35;border-bottom:3px solid #FF6B35;padding:0 2px}
.content{padding:16px;max-width:500px;margin:0 auto}
.question-card{background:#fff;border-radius:16px;padding:24px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,0.06)}
.q-number{font-size:13px;color:#999;margin-bottom:8px}
.q-prompt{font-size:18px;font-weight:600;margin-bottom:16px;line-height:1.6}
.q-char{font-size:72px;text-align:center;margin:16px 0;color:#333;font-weight:700}
.options{display:flex;flex-direction:column;gap:10px}
.opt{padding:14px 18px;border:2px solid #e0e0e0;border-radius:12px;font-size:16px;cursor:pointer;transition:all 0.2s;text-align:center;font-weight:500}
.opt:active{transform:scale(0.97)}
.opt.correct{border-color:#4CAF50;background:#E8F5E9;color:#2E7D32}
.opt.wrong{border-color:#F44336;background:#FFEBEE;color:#C62828}
.opt.show-correct{border-color:#4CAF50;background:#E8F5E9;color:#2E7D32;font-weight:700}
.explanation{margin-top:12px;padding:12px 16px;background:#F5F5F5;border-radius:10px;font-size:14px;color:#666;line-height:1.5}
.next-btn{display:none;width:100%;padding:14px;background:#FF6B35;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-top:12px}
.next-btn:active{background:#E55A2B}
.score-card{background:#fff;border-radius:16px;padding:32px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,0.06)}
.score-emoji{font-size:64px;margin-bottom:12px}
.score-stars{font-size:34px;color:#FFB300;letter-spacing:6px;margin-bottom:6px;text-shadow:0 2px 6px rgba(255,179,0,.3)}
.score-text{font-size:36px;font-weight:700;color:#FF6B35;margin-bottom:8px}
.score-msg{font-size:16px;color:#666;margin-bottom:12px}
.score-sub{font-size:13px;color:#999;margin-bottom:18px}
.week-cal{margin:12px auto 16px;background:#fafafa;border-radius:12px;padding:12px 14px;max-width:320px}
.wc-title{font-size:12px;color:#999;font-weight:600;margin-bottom:10px;text-align:left}
.wc-row{display:flex;justify-content:space-between}
.wc-cell{display:flex;flex-direction:column;align-items:center;gap:4px}
.wc-dot{width:26px;height:26px;border-radius:7px;background:#e8e8e8}
.wc-dot.l1{background:#c8e6c9}.wc-dot.l2{background:#81c784}.wc-dot.l3{background:#4caf50}
.wc-cell.today .wc-dot{outline:2px solid #FF6B35;outline-offset:1px}
.wc-wd{font-size:10px;color:#aaa}
.speak-btn{display:inline-block;margin:8px 0 4px;padding:7px 16px;background:#E3F2FD;color:#1976D2;border:none;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer}
.speak-btn:active{background:#BBDEFB}
.restart-btn{padding:12px 32px;background:#FF6B35;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer}
.progress-bar{background:#e0e0e0;border-radius:10px;height:8px;margin-bottom:16px}
.progress-fill{height:100%;border-radius:10px;transition:width 0.3s}
.en-fill{background:#1976D2}
.zh-fill{background:#E65100}
.math-fill{background:#2E7D32}
.go-fill{background:#7B1FA2}
.board{display:inline-grid;gap:1px;background:#DEB887;padding:8px;border-radius:8px;margin:0 auto}
.cell{display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:12px;font-weight:700;cursor:pointer}
.cell-black{background:#333;color:#fff}
.cell-white{background:#fff;color:#333;border:1px solid #ccc}
.cell-empty{background:transparent;border:1px dashed rgba(0,0,0,0.2)}
.cell-cand{border:2px solid #FF6B35 !important;background:rgba(255,107,53,0.15) !important}
.cand-num{width:22px;height:22px;border-radius:50%;background:#FF6B35;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.cell-answer-good{background:#4CAF50 !important;border-color:#4CAF50 !important}
.cell-answer-bad{background:#F44336 !important;border-color:#F44336 !important}
.go-labels{font-size:11px;color:#a0713e;font-weight:600;display:flex;align-items:center;justify-content:center}
.go-labels-col{display:grid;gap:1px}
.go-labels-row{display:grid;gap:1px}
.go-tip{font-size:12px;color:#888;margin-top:8px;text-align:center}
.board.dark{background:#4E342E}
.board.dark .cell-empty{border:1px dashed rgba(255,255,255,0.3)}
.board.dark .go-labels{color:#d7b98c}
.star-point{width:7px;height:7px;border-radius:50%;background:rgba(0,0,0,0.55)}
.board.dark .star-point{background:rgba(255,255,255,0.6)}
.theme-btn{display:inline-block;margin:8px 4px 0;padding:5px 12px;background:#F3E5F5;color:#7B1FA2;border:none;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer}
.theme-btn.active{background:#7B1FA2;color:#fff}
.combo{display:inline-block;margin-left:8px;font-size:13px;color:#E65100;font-weight:700}
.hint-btn{display:inline-block;margin:6px 0 4px;padding:5px 14px;background:#FFF8E1;color:#B26A00;border:none;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer}
.hint-reveal{margin:8px 0 0;padding:8px 12px;background:#FFF8E1;color:#8D6E00;border-radius:10px;font-size:13px;font-weight:600;text-align:center}
.go-topic-picker{max-width:480px;margin:0 auto;padding:16px}
.go-topic-picker .tp-card{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:14px;cursor:pointer}
.go-topic-picker .tp-card:active{transform:scale(.97)}
.go-topic-picker .tp-ico{font-size:30px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:13px;background:#F3E5F5;flex-shrink:0}
.go-topic-picker h3{font-size:16px;font-weight:700}
.go-topic-picker p{font-size:12px;color:#888;margin-top:2px}
.hint{font-size:13px;color:#888;margin-top:4px}
.hidden{display:none}
.fade-in{animation:fadeIn 0.3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="header">
<h1>🐻 Peter 学习小助手</h1>
<div class="date" id="dateDisplay"></div>
<div class="date" id="streakDisplay" style="margin-top:4px;font-weight:600"></div>
</div>
<div class="nav">
<button class="en-btn" onclick="switchModule('en')">🇬🇧 英语</button>
<button class="zh-btn" onclick="switchModule('zh')">📖 语文</button>
<button class="math-btn" onclick="switchModule('math')">🧮 数学</button>
<button class="go-btn" onclick="switchModule('go')">⚫ 围棋</button>
</div>
<div class="content" id="content">
<div class="question-card" style="text-align:center;padding:40px">
<div style="font-size:48px;margin-bottom:16px">👋</div>
<div style="font-size:18px;font-weight:600;margin-bottom:8px">Peter，你好！</div>
<div style="font-size:14px;color:#888">选择一个科目开始今天的练习吧</div>
</div>
</div>
<script>
function localDate() {
const d = new Date();
return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
const today = localDate();
document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('zh-CN', {year:'numeric',month:'long',day:'numeric',weekday:'long'});
// 头部显示连续打卡
function renderStreak() {
try {
const p = JSON.parse(localStorage.getItem('peter_progress') || '{}');
const n = p.streak || 0;
const el = document.getElementById('streakDisplay');
if (el) el.textContent = n > 0 ? '🔥 已连续打卡 ' + n + ' 天' : '🌟 今天开始打卡吧';
} catch(e) {}
}
renderStreak();

// ===== 语音朗读（浏览器自带 TTS，无需联网）=====
let voiceCn = null, voiceEn = null;
function pickVoices() {
const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
voiceCn = vs.find(v => v.lang && v.lang.toLowerCase().startsWith('zh')) || null;
voiceEn = vs.find(v => v.lang && v.lang.toLowerCase().startsWith('en')) || null;
}
if ('speechSynthesis' in window) {
pickVoices();
speechSynthesis.onvoiceschanged = pickVoices;
}
function speak(text, lang) {
if (!('speechSynthesis' in window) || !text) return;
try {
speechSynthesis.cancel();
const u = new SpeechSynthesisUtterance(text);
u.lang = lang || 'zh-CN';
u.rate = (lang || '').startsWith('zh') ? 0.8 : 0.85;
const v = (lang || '').startsWith('zh') ? voiceCn : voiceEn;
if (v) u.voice = v;
speechSynthesis.speak(u);
} catch(e) {}
}
// 简单答题音效
function playTone(ok) {
try {
const ctx = new (window.AudioContext || window.webkitAudioContext)();
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.connect(gain); gain.connect(ctx.destination);
osc.type = 'sine';
osc.frequency.value = ok ? 880 : 330;
gain.gain.setValueAtTime(0.12, ctx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
osc.start(); osc.stop(ctx.currentTime + 0.22);
setTimeout(() => ctx.close(), 500);
} catch(e) {}
}

// ===== 错题本（间隔重复：错的题优先再出）=====
function loadWrong() { try { return JSON.parse(localStorage.getItem('peter_wrong') || '{}'); } catch(e) { return {}; } }
function saveWrong(w) { try { localStorage.setItem('peter_wrong', JSON.stringify(w)); } catch(e) {} }
function wrongKey(q) {
if (currentModule === 'go') return 'go:' + q.id;
if (currentModule === 'zh') return 'zh:' + q.char;
if (currentModule === 'math') return null; // 随机口算题不重样，不进错题本
return 'en:' + q.en;
}
function addWrong(q) {
const k = wrongKey(q);
if (!k) return;
const w = loadWrong();
w[k] = (w[k] || 0) + 1;
saveWrong(w);
}
function clearWrong(q) {
const k = wrongKey(q);
if (!k) return;
const w = loadWrong();
if (w[k]) {
w[k] -= 1;
if (w[k] <= 0) delete w[k];
saveWrong(w);
}
}
// 从错题本取优先题（最多 3 道）
function takeWrongFirst(allQuestions, makeQ) {
const w = loadWrong();
const keys = Object.keys(w).filter(k => w[k] > 0);
if (!keys.length) return { first: [], rest: allQuestions };
const wrongItems = allQuestions.filter(q => wrongKey(q) in w);
const picked = [];
const rest = allQuestions.filter(q => !wrongItems.includes(q));
const pool = shuffle([...wrongItems]);
while (picked.length < 3 && pool.length) picked.push(pool.pop());
return { first: picked, rest };
}

let enData = null, zhData = null, goData = null;
let currentModule = null, currentQ = 0, score = 0, questions = [];
let answered = false;
let lives = 3;          // ❤️ 生命值（Kidjent 式 3 条命）
let autoTimer = null;   // 自动下一题计时器
let combo = 0;          // 🔥 连击数（katrain 训练感）

// ===== 数学口算题（填空式，Kidjent 风格 + 常见错误干扰项）=====
function genMathQuestion() {
// 难度：0=20以内 1=100以内进退位（轮内前 5 题简单，后 5 题标准）
const hard = currentQ >= 5;
let b, c, ans, text, op, a2, hid;
if (Math.random() < 0.5) {
// 加法 a + b = c
const a = hard ? 11 + Math.floor(Math.random() * 70) : 2 + Math.floor(Math.random() * 16);
b = hard ? 11 + Math.floor(Math.random() * 70) : 2 + Math.floor(Math.random() * 16);
c = a + b;
op = '+';
hid = Math.floor(Math.random() * 3);
if (hid === 0) { text = '__ + ' + b + ' = ' + c; ans = a; }
else if (hid === 1) { text = a + ' + __ = ' + c; ans = b; }
else { text = a + ' + ' + b + ' = __'; ans = c; }
} else {
// 减法 a - b = c（保证 a<=99 且 a>b）
b = hard ? 5 + Math.floor(Math.random() * 45) : 1 + Math.floor(Math.random() * 9);
c = hard ? 5 + Math.floor(Math.random() * 40) : 1 + Math.floor(Math.random() * 15);
a2 = b + c;
op = '-';
hid = Math.floor(Math.random() * 3);
if (hid === 0) { text = '__ - ' + b + ' = ' + c; ans = a2; }
else if (hid === 1) { text = a2 + ' - __ = ' + c; ans = b; }
else { text = a2 + ' - ' + b + ' = __'; ans = c; }
}
// 干扰项：±1/±10/进退位常见错误，保证唯一且 >=0
const wrongs = new Set();
const cands = [ans + 1, ans - 1, ans + 10, ans - 10, ans + 2, ans - 2];
if (hard) cands.push(ans + 9, ans - 9);
for (const c2 of cands) {
if (wrongs.size >= 3) break;
if (c2 !== ans && c2 >= 0 && c2 <= 100) wrongs.add(c2);
}
let filler = 1;
while (wrongs.size < 3) {
const c2 = ans + filler;
if (c2 !== ans && c2 >= 0) wrongs.add(c2);
filler++;
}
const options = shuffle([ans, ...wrongs]);
let full;
if (op === '+') {
full = hid === 0 ? ans + ' + ' + b + ' = ' + c : hid === 1 ? a2 + ' + ' + ans + ' = ' + c : a2 + ' + ' + b + ' = ' + ans;
} else {
full = hid === 0 ? ans + ' - ' + b + ' = ' + c : hid === 1 ? a2 + ' - ' + ans + ' = ' + c : a2 + ' - ' + b + ' = ' + ans;
}
return {
math: true,
question: text,
hint: hard ? '100 以内进退位' : '20 以内口算',
options: options.map(String),
correct: String(ans),
explanation: full
};
}

async function loadData() {
try {
	const [e, z, g] = await Promise.all([
	fetch('../data/english.json').then(r => r.json()),
	fetch('../data/chinese.json').then(r => r.json()),
	fetch('../data/go.json').then(r => r.json())
	]);
enData = e; zhData = z; goData = g;
} catch(e) {
document.getElementById('content').innerHTML = '<div class="question-card" style="text-align:center;padding:40px"><div style="font-size:48px;margin-bottom:16px">⚠️</div><div>加载数据失败，请确保服务器在运行</div></div>';
}
}

function shuffle(arr) {
for (let i = arr.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[arr[i], arr[j]] = [arr[j], arr[i]];
}
return arr;
}

function generateQuestions(module) {
	if (module === 'math') {
	return Array.from({length: 10}, () => genMathQuestion());
	}
	if (module === 'en') {
	const allWords = [];
	enData.units.forEach(u => u.words.forEach(w => allWords.push({...w, unit: u.id})));
	const base = allWords.map(w => ({
	en: w.en,
	question: `${w.en}`,
	hint: `选择正确的中文意思`,
	options: shuffle([w.cn, ...w.distractors]),
	correct: w.cn
	}));
	const { first, rest } = takeWrongFirst(base, null);
	const selected = shuffle([...first, ...shuffle(rest).slice(0, 10 - first.length)]);
	return selected;
	} else if (module === 'zh') {
	const allChars = [];
	zhData.categories.forEach(c => c.chars.forEach(ch => allChars.push({...ch, cat: c.id})));
	const base = allChars.map(ch => ({
	char: ch.char,
	question: `${ch.pinyin}`,
	hint: `${ch.stroke}画 · 选择正确的汉字`,
	options: shuffle([ch.char, ...ch.distractors]),
	correct: ch.char,
	meaning: ch.meaning
	}));
	const { first, rest } = takeWrongFirst(base, null);
	const selected = shuffle([...first, ...shuffle(rest).slice(0, 10 - first.length)]);
	return selected;
	} else {
	let pool = goData.puzzles;
	if (goTopic !== 'all') {
	pool = pool.filter(p => GO_THEME_MAP[p.theme] === goTopic);
	}
	const { first, rest } = takeWrongFirst(pool, null);
	const selected = shuffle([...first, ...shuffle(rest)]).slice(0, 10);
	return selected.map(p => {
	const letters = 'ABCDEFGH';
	const correctLabel = letters[p.answer.col] + (p.size - p.answer.row);
	// cells：候选点（含坐标），用于在棋盘上直接点选
	const cells = [{row: p.answer.row, col: p.answer.col, label: correctLabel}];
	while (cells.length < 3) {
	const r = Math.floor(Math.random() * p.size);
	const c = Math.floor(Math.random() * p.size);
	const label = letters[c] + (p.size - r);
	if (!cells.some(o => o.label === label) && p.board[r][c] === '.') {
	cells.push({row: r, col: c, label});
	}
	}
	shuffle(cells);
	return {
	...p,
	question: p.question,
	hint: p.hint,
	cells: cells,
	options: cells.map(o => o.label),
	correct: correctLabel,
	explanation: p.explanation
	};
	});
	}
}

function isStarPoint(sz, r, c) {
	if (sz === 3) return r === 1 && c === 1;
	if (sz === 5) return r === 2 && c === 2;
	if (sz === 7) return (r === 1 || r === 5) && (c === 1 || c === 5);
	return false;
}
// 棋盘主题（kaya 风格）：经典木色 / 深色
function boardTheme() {
try { return localStorage.getItem('peter_board_theme') || 'light'; } catch(e) { return 'light'; }
}
function toggleBoardTheme() {
const next = boardTheme() === 'light' ? 'dark' : 'light';
try { localStorage.setItem('peter_board_theme', next); } catch(e) {}
const board = document.querySelector('.board');
if (board) board.classList.toggle('dark', next === 'dark');
const btn = document.getElementById('themeBtn');
if (btn) btn.textContent = next === 'dark' ? '🎨 浅色棋盘' : '🎨 深色棋盘';
}
function renderBoard(puzzle) {
	const sz = puzzle.size;
	const cellSize = Math.min(36, (300 / sz));
	const letters = 'ABCDEFGH';
	const cells = puzzle.cells || [];
	const darkCls = boardTheme() === 'dark' ? ' dark' : '';
	// 列字母标注（A B C ...）
	let colLabels = '<div class="go-labels" style="grid-template-columns:repeat(' + sz + ',' + cellSize + 'px);grid-column:2;display:grid;gap:1px">';
	for (let c = 0; c < sz; c++) {
	colLabels += '<div class="go-labels">' + letters[c] + '</div>';
	}
	colLabels += '</div>';
	// 行数字标注（size..1）
	let rowLabels = '<div class="go-labels" style="grid-template-rows:repeat(' + sz + ',' + cellSize + 'px);grid-row:2;display:grid;gap:1px">';
	for (let r = 0; r < sz; r++) {
	rowLabels += '<div class="go-labels">' + (sz - r) + '</div>';
	}
	rowLabels += '</div>';

	let html = '<div style="margin:12px auto;display:inline-block">';
	html += '<div style="display:grid;grid-template-columns:' + cellSize + 'px auto;grid-template-rows:' + (cellSize / 2) + 'px auto;gap:0">';
	html += '<div></div>' + colLabels + rowLabels;
	html += '<div class="board' + darkCls + '" style="grid-template-columns:repeat(' + sz + ',' + cellSize + 'px);max-width:' + (sz * cellSize + 16) + 'px">';
	for (let r = 0; r < sz; r++) {
	for (let c = 0; c < sz; c++) {
	const stone = puzzle.board[r][c];
	const cls = stone === 'B' ? 'cell-black' : stone === 'W' ? 'cell-white' : 'cell-empty';
	const candIdx = cells.findIndex(o => o.row === r && o.col === c);
	let inner = stone || '';
	let candCls = '';
	if (candIdx >= 0) {
	candCls = ' cell-cand';
	inner = '<span class="cand-num">' + (candIdx + 1) + '</span>';
	} else if (stone === '.' && isStarPoint(sz, r, c)) {
	// 星位标记（Sabaki/标准棋盘）
	inner = '<span class="star-point"></span>';
	}
	html += '<div class="cell ' + cls + candCls + '" id="gocell-' + r + '-' + c + '" onclick="goCellClick(' + r + ',' + c + ')" style="width:' + cellSize + 'px;height:' + cellSize + 'px">' + inner + '</div>';
	}
	}
	html += '</div></div></div>';
	return html;
}

function goCellClick(r, c) {
	if (answered || currentModule !== 'go') return;
	const q = questions[currentQ];
	const idx = q.cells.findIndex(o => o.row === r && o.col === c);
	if (idx >= 0) checkAnswer(idx);
}

function showQuestion() {
const q = questions[currentQ];
const content = document.getElementById('content');
const colors = {en: '#1976D2', zh: '#E65100', math: '#2E7D32', go: '#7B1FA2'};
const fillCls = {en: 'en-fill', zh: 'zh-fill', math: 'math-fill', go: 'go-fill'};

	let extra = '';
	if (currentModule === 'zh' && q.char) {
	extra = `<div class="q-char">${q.char}</div>`;
	} else if (currentModule === 'math') {
	extra = `<div class="math-prompt">${q.question.replace('__', '<span class="math-unknown">__</span>')}</div>`;
	} else if (currentModule === 'go') {
	extra = renderBoard(q);
	}

	// 朗读按钮：英语读单词/短句，语文读汉字
	let speakBtn = '';
	if (currentModule === 'en') {
	speakBtn = `<button class="speak-btn" onclick="speak('${q.question.replace(/'/g, "\\'")}','en-US')">🔊 听发音</button>`;
	} else if (currentModule === 'zh' && q.char) {
	speakBtn = `<button class="speak-btn" onclick="speak('${q.char}','zh-CN')">🔊 听一听</button>`;
	}

	let optionHtml;
	if (currentModule === 'go') {
	optionHtml = q.cells.map((cell, i) =>
	`<div class="opt" onclick="checkAnswer(${i})" id="opt-${i}">圈${i + 1}（${cell.label}）</div>`
	).join('');
	} else {
	optionHtml = q.options.map((opt, i) =>
	`<div class="opt" onclick="checkAnswer(${i})" id="opt-${i}">${opt}</div>`
	).join('');
	}

	const goTip = currentModule === 'go' ? '<div class="go-tip">👆 点击棋盘上带圈的位置答题（也可以点下面的圈号）</div>' : '';
	// 生命值显示（Kidjent 式 3 条命）
	const livesHtml = '<div class="lives">' + [0, 1, 2].map(i => '<span class="' + (i < lives ? '' : 'lost') + '">❤️</span>').join('') + (combo >= 2 ? '<span class="combo">🔥 连对 ' + combo + ' 题</span>' : '') + '</div>';
	// 💡 提示（katrain 提示系统简化：默认隐藏，点击显示）
	const hintBtn = '<button class="hint-btn" onclick="revealHint()">💡 提示</button>';
	const hintBox = '<div class="hint-reveal hidden" id="hintBox">' + q.hint + '</div>';
	const themeBtn = currentModule === 'go' ? '<button class="theme-btn" id="themeBtn" onclick="toggleBoardTheme()">' + (boardTheme() === 'dark' ? '🎨 浅色棋盘' : '🎨 深色棋盘') + '</button>' : '';

	content.innerHTML = `
	<div class="fade-in">
	<div class="progress-bar"><div class="progress-fill ${fillCls[currentModule]}" style="width:${(currentQ + 1) / 10 * 100}%"></div></div>
	${livesHtml}
	<div class="question-card">
	<div class="q-number">第 ${currentQ + 1} / ${questions.length} 题</div>
	<div class="q-prompt">${q.question}</div>
	${hintBtn}
	${hintBox}
	${speakBtn}
	${extra}
	</div>
	${goTip}
	${themeBtn}
	<div class="options">
	${optionHtml}
	</div>
	<div class="explanation hidden" id="explanation">${q.explanation || `正确答案：${q.correct}`}</div>
	<button class="next-btn" id="nextBtn" onclick="nextQuestion()">下一题 →</button>
	</div>
	`;
	answered = false;
}

function revealHint() {
	const box = document.getElementById('hintBox');
	if (box) box.classList.remove('hidden');
}

// ===== 围棋专项训练（katrain 风格：按主题分组）=====
let goTopic = 'all'; // all/手筋/死活/对杀/布局
const GO_TOPICS = [
	{ id: 'all', ico: '♟️', name: '综合练习', desc: '全部 31 道题混合出' },
	{ id: '手筋', ico: '🪄', name: '基础手筋', desc: '打吃 · 双吃 · 提子 · 征子 · 倒扑 · 接不归' },
	{ id: '死活', ico: '🏠', name: '死活训练', desc: '做眼 · 杀棋 · 活棋 · 点眼' },
	{ id: '对杀', ico: '⚔️', name: '对杀训练', desc: '紧气 · 长气 · 数气' },
	{ id: '布局', ico: '🗺️', name: '布局训练', desc: '占角 · 守角 · 挂角 · 拆边' },
];
const GO_THEME_MAP = {
	'提子': '手筋', '打吃': '手筋', '双吃': '手筋', '征子': '手筋', '扑': '手筋',
	'挖': '手筋', '枷': '手筋', '接不归': '手筋', '倒扑': '手筋', '胀死牛': '手筋', '劫材': '手筋',
	'做眼': '死活', '虎': '死活', '杀棋': '死活', '金鸡独立': '死活', '接': '死活',
	'对杀': '对杀', '布局': '布局'
};
function showGoTopicPicker() {
	const content = document.getElementById('content');
	let html = '<div class="go-topic-picker fade-in"><div class="q-number" style="margin-bottom:10px">选择练习主题</div>';
	GO_TOPICS.forEach(t => {
	const n = t.id === 'all' ? goData.puzzles.length : goData.puzzles.filter(p => GO_THEME_MAP[p.theme] === t.id).length;
	html += '<div class="tp-card" onclick="startGoTopic(\'' + t.id + '\')">' +
	'<div class="tp-ico">' + t.ico + '</div>' +
	'<div><h3>' + t.name + '</h3><p>' + t.desc + '（' + n + ' 题）</p></div></div>';
	});
	html += '</div>';
	content.innerHTML = html;
}
function startGoTopic(topic) {
	goTopic = topic;
	currentQ = 0;
	score = 0;
	lives = 3;
	questions = generateQuestions('go');
	showQuestion();
}

function checkAnswer(idx) {
	if (answered) return;
	answered = true;
	const q = questions[currentQ];
	const opt = document.getElementById('opt-' + idx);
	const isCorrect = q.options[idx] === q.correct;

	if (isCorrect) {
	opt.classList.add('correct');
	score++;
	combo++;
	playTone(true);
	clearWrong(q);
	// 答对：从错题本消掉一次（zh/en 顺便朗读）
	if (currentModule === 'zh' && q.char) speak(q.char, 'zh-CN');
	if (currentModule === 'en' && q.en) speak(q.en, 'en-US');
	} else {
	opt.classList.add('wrong');
	combo = 0;
	playTone(false);
	addWrong(q);
	lives--;
	const livesEl = document.querySelector('.lives');
	if (livesEl) {
	livesEl.innerHTML = [0, 1, 2].map(i => '<span class="' + (i < lives ? '' : 'lost') + '">❤️</span>').join('');
	}
	q.options.forEach((o, i) => {
	if (o === q.correct) {
	document.getElementById('opt-' + i).classList.add('show-correct');
	}
	});
	}

	// 围棋：棋盘上同步反馈（绿色=正确落点，红色=选错）
	if (currentModule === 'go') {
	q.cells.forEach((cell, i) => {
	const el = document.getElementById('gocell-' + cell.row + '-' + cell.col);
	if (el) {
	if (cell.label === q.correct) {
	el.classList.add('cell-answer-good');
	} else if (i === idx) {
	el.classList.add('cell-answer-bad');
	}
	}
	});
	}
	document.getElementById('explanation').classList.remove('hidden');
	document.getElementById('nextBtn').style.display = 'block';
	// ⚡ 自动下一题（Kidjent 式即时节奏）：答对 0.6s，答错 1.8s（围棋看解释留 2.2s）
	clearTimeout(autoTimer);
	const delay = isCorrect ? 600 : (currentModule === 'go' ? 2200 : 1800);
	autoTimer = setTimeout(() => {
	if (lives <= 0) {
	showResults(true);
	} else {
	nextQuestion();
	}
	}, delay);
}

function nextQuestion() {
	clearTimeout(autoTimer);
	currentQ++;
	if (currentQ >= questions.length || lives <= 0) {
	showResults(lives <= 0);
	return;
	}
	showQuestion();
}

// 本周打卡日历（周一~周日，当天练了几科就几级绿）
function weekCalendar() {
const p = JSON.parse(localStorage.getItem('peter_progress') || '{}');
const now = new Date();
const dow = (now.getDay() + 6) % 7; // 周一=0
const monday = new Date(now);
monday.setDate(now.getDate() - dow);
let html = '<div class="week-cal"><div class="wc-title">📅 本周打卡（练得越多越绿）</div><div class="wc-row">';
for (let i = 0; i < 7; i++) {
const d = new Date(monday);
d.setDate(monday.getDate() + i);
const ds = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const day = p[ds] || {};
const mods = Object.keys(day).filter(k => k !== 'streak' && k !== 'lastDate').length;
const lvl = mods === 0 ? '' : mods === 1 ? 'l1' : mods === 2 ? 'l2' : 'l3';
const isToday = ds === today;
const wd = ['一', '二', '三', '四', '五', '六', '日'][i];
html += '<div class="wc-cell' + (isToday ? ' today' : '') + '"><div class="wc-dot ' + lvl + '"></div><div class="wc-wd">' + wd + '</div></div>';
}
html += '</div></div>';
return html;
}

function showResults(early) {
const content = document.getElementById('content');
const total = questions.length || 10;
const pct = total ? score / total : 0;
const emoji = early ? '💔' : pct >= 0.9 ? '🏆' : pct >= 0.7 ? '⭐' : pct >= 0.5 ? '👍' : '💪';
const msg = early ? '生命耗尽！下次小心点' : pct >= 0.9 ? '太棒了！完美！' : pct >= 0.7 ? '不错！继续加油！' : pct >= 0.5 ? '还可以，再练练！' : '没关系，明天继续！';

// 星级：≥90% 三星，≥70% 两星，≥50% 一星
const stars = pct >= 0.9 ? 3 : pct >= 0.7 ? 2 : pct >= 0.5 ? 1 : 0;
const starHtml = '★'.repeat(stars) + '☆'.repeat(3 - stars);

// 记录成绩 + 连续打卡
const progress = JSON.parse(localStorage.getItem('peter_progress') || '{}');
if (!progress[today]) progress[today] = {};
progress[today][currentModule] = score;
const last = progress.lastDate || '';
if (last !== today) {
const y = new Date(Date.now() - 86400000);
const yesterday = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');
progress.streak = (last === yesterday ? (progress.streak || 0) : 0) + 1;
progress.lastDate = today;
}
localStorage.setItem('peter_progress', JSON.stringify(progress));
renderStreak();

// 本轮错题数（提示进了错题本）
const wrongMap = loadWrong();
const wrongCount = questions.filter(q => wrongMap[wrongKey(q)] > 0).length;
const wrongNote = wrongCount > 0 ? `<div class="score-sub">📒 有 ${wrongCount} 题进了错题本，下次练习会优先出现</div>` : '';
const livesLeft = lives > 0 ? `<div class="score-sub">❤️ 还剩 ${lives} 条命</div>` : '';

content.innerHTML = `
<div class="fade-in">
<div class="score-card">
<div class="score-emoji">${emoji}</div>
<div class="score-stars">${starHtml}</div>
<div class="score-text">${score} / ${total}</div>
<div class="score-msg">${msg}</div>
<div class="score-sub">🔥 已连续打卡 ${progress.streak || 0} 天</div>
${livesLeft}
${weekCalendar()}
${wrongNote}
<button class="restart-btn" onclick="switchModule('${currentModule}')">再来一局</button>
</div>
</div>
`;
}

function switchModule(module) {
	currentModule = module;
	currentQ = 0;
	score = 0;
	lives = 3;
	combo = 0;
	clearTimeout(autoTimer);
	document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
	document.querySelector(`.nav .${module}-btn`).classList.add('active');
	if (module === 'go') {
	// 围棋专项训练：先选主题（katrain 风格）
	showGoTopicPicker();
	return;
	}
	questions = generateQuestions(module);
	showQuestion();
}

loadData();
</script>
