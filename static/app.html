<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🐻 Peter 学习</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'PingFang SC','Noto Sans SC','PingFang SC',sans-serif;background:linear-gradient(180deg,#eef4ff 0%,#fdf2f8 50%,#f0fdf4 100%);color:#333;min-height:100vh}
/* ===== 头部 ===== */
.header{background:linear-gradient(135deg,#FF6B35 0%,#FF8E53 45%,#FFB84D 100%);color:#fff;padding:22px 20px 26px;text-align:center;position:sticky;top:0;z-index:10;border-radius:0 0 32px 32px;box-shadow:0 6px 24px rgba(255,107,53,.25)}
.header h1{font-size:25px;margin-bottom:4px;text-shadow:0 2px 6px rgba(0,0,0,.12);letter-spacing:1px}
.header .date{font-size:13.5px;opacity:.92}
.header .streak{display:inline-block;margin-top:8px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:4px 14px;font-size:13px;font-weight:600;backdrop-filter:blur(4px)}
/* ===== 科目导航 ===== */
.nav{display:flex;justify-content:center;gap:10px;padding:14px 12px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);box-shadow:0 3px 12px rgba(0,0,0,.06);position:sticky;top:92px;z-index:9;border-radius:0 0 20px 20px}
.nav button{padding:10px 14px;border:none;border-radius:22px;font-size:14.5px;font-weight:700;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);letter-spacing:.5px}
.nav button:active{transform:scale(.92)}
.nav .en-btn{background:#E3F2FD;color:#1976D2}
.nav .en-btn.active,.nav .en-btn:active{background:#1976D2;color:#fff;box-shadow:0 4px 12px rgba(25,118,210,.35)}
.nav .zh-btn{background:#FFF3E0;color:#E65100}
.nav .zh-btn.active,.nav .zh-btn:active{background:#E65100;color:#fff;box-shadow:0 4px 12px rgba(230,81,0,.35)}
.nav .math-btn{background:#E8F5E9;color:#2E7D32}
.nav .math-btn.active,.nav .math-btn:active{background:#2E7D32;color:#fff;box-shadow:0 4px 12px rgba(46,125,50,.35)}
.nav .go-btn{background:#F3E5F5;color:#7B1FA2}
.nav .go-btn.active,.nav .go-btn:active{background:#7B1FA2;color:#fff;box-shadow:0 4px 12px rgba(123,31,162,.35)}
/* ===== 内容区 ===== */
.content{padding:16px;max-width:500px;margin:0 auto}
.lives{font-size:19px;letter-spacing:5px;margin-bottom:10px;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.06)}
.lives .lost{opacity:.22;filter:grayscale(1);transform:scale(.85);display:inline-block;transition:all .3s}
.combo{display:inline-block;margin-left:10px;font-size:14px;color:#E65100;font-weight:800;background:#FFF3E0;padding:3px 12px;border-radius:14px;animation:pulse 1s infinite}
/* ===== 答题卡 ===== */
.question-card{background:#fff;border-radius:22px;padding:24px 20px 20px;margin-bottom:16px;box-shadow:0 8px 28px rgba(30,50,100,.10);position:relative;overflow:hidden;border-top:6px solid var(--sub, #FF8E53)}
.q-number{font-size:12.5px;color:#999;margin-bottom:8px;font-weight:600;letter-spacing:.5px}
.q-prompt{font-size:19px;font-weight:700;margin-bottom:14px;line-height:1.65;color:#263238}
.q-char{font-size:76px;text-align:center;margin:14px 0;color:#E65100;font-weight:800;text-shadow:0 3px 10px rgba(230,81,0,.15);animation:popIn .35s cubic-bezier(.34,1.56,.64,1)}
.math-prompt{font-size:32px;font-weight:800;text-align:center;margin:10px 0 4px;letter-spacing:3px;color:#2E7D32}
.math-unknown{color:#FF6B35;border-bottom:4px solid #FF6B35;padding:0 3px;animation:blink 1.2s infinite}
/* ===== 选项按钮 ===== */
.options{display:flex;flex-direction:column;gap:11px}
.opt{padding:15px 18px;border:2px solid transparent;border-radius:16px;font-size:17px;font-weight:700;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);text-align:center;background:#f6f8fc;color:#37474F;box-shadow:0 2px 6px rgba(30,50,100,.06);position:relative;display:flex;align-items:center;justify-content:center;gap:8px}
.opt .opt-key{width:26px;height:26px;border-radius:50%;background:#e3e8f0;color:#5c6b7a;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opt:active{transform:scale(.96)}
.opt.correct{background:linear-gradient(135deg,#43A047,#66BB6A);color:#fff;border-color:#2E7D32;animation:bounce .45s cubic-bezier(.34,1.56,.64,1);box-shadow:0 6px 18px rgba(67,160,71,.35)}
.opt.correct .opt-key{background:rgba(255,255,255,.3);color:#fff}
.opt.wrong{background:linear-gradient(135deg,#E53935,#EF5350);color:#fff;border-color:#C62828;animation:shake .4s;box-shadow:0 6px 18px rgba(229,57,53,.3)}
.opt.wrong .opt-key{background:rgba(255,255,255,.3);color:#fff}
.opt.show-correct{border-color:#4CAF50;background:#E8F5E9;color:#2E7D32;font-weight:800}
/* ===== 反馈区 ===== */
.explanation{margin-top:12px;padding:12px 16px;background:linear-gradient(135deg,#FFF8E1,#FFF3E0);border-left:4px solid #FFB300;border-radius:10px;font-size:14px;color:#6D4C00;line-height:1.6;animation:fadeIn .3s ease}
.next-btn{display:none;width:100%;padding:15px;background:linear-gradient(135deg,#FF6B35,#FF8E53);color:#fff;border:none;border-radius:16px;font-size:17px;font-weight:700;cursor:pointer;margin-top:14px;box-shadow:0 6px 18px rgba(255,107,53,.35);letter-spacing:2px}
.next-btn:active{transform:scale(.97)}
.progress-bar{background:#e8ecf3;border-radius:12px;height:10px;margin-bottom:14px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}
.progress-fill{height:100%;border-radius:12px;transition:width .5s cubic-bezier(.4,0,.2,1);background-size:200% 100%;animation:progressShine 2.5s linear infinite}
.en-fill{background:linear-gradient(90deg,#1976D2,#42A5F5)}
.zh-fill{background:linear-gradient(90deg,#E65100,#FF8E53)}
.math-fill{background:linear-gradient(90deg,#2E7D32,#66BB6A)}
.go-fill{background:linear-gradient(90deg,#7B1FA2,#AB47BC)}
/* ===== 完成页 ===== */
.score-card{background:linear-gradient(160deg,#fff 0%,#FFF8F0 100%);border-radius:26px;padding:34px 24px;text-align:center;box-shadow:0 12px 36px rgba(255,107,53,.15);border-top:6px solid #FFB300}
.score-emoji{font-size:72px;margin-bottom:10px;animation:popIn .5s cubic-bezier(.34,1.56,.64,1)}
.score-stars{font-size:40px;color:#FFB300;letter-spacing:8px;margin-bottom:8px;text-shadow:0 3px 10px rgba(255,179,0,.4)}
.score-stars .star{display:inline-block;animation:starPop .5s cubic-bezier(.34,1.56,.64,1) backwards}
.score-text{font-size:40px;font-weight:800;color:#FF6B35;margin-bottom:6px}
.score-msg{font-size:17px;color:#666;margin-bottom:12px;font-weight:600}
.score-sub{font-size:13px;color:#999;margin-bottom:16px}
.restart-btn{padding:14px 38px;background:linear-gradient(135deg,#FF6B35,#FF8E53);color:#fff;border:none;border-radius:20px;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(255,107,53,.35);letter-spacing:1px}
.restart-btn:active{transform:scale(.95)}
/* ===== 打卡日历 ===== */
.week-cal{margin:12px auto 16px;background:rgba(255,255,255,.9);border-radius:16px;padding:12px 14px;max-width:320px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.wc-title{font-size:12px;color:#999;font-weight:600;margin-bottom:10px;text-align:left}
.wc-row{display:flex;justify-content:space-between}
.wc-cell{display:flex;flex-direction:column;align-items:center;gap:4px}
.wc-dot{width:26px;height:26px;border-radius:8px;background:#e8e8e8;transition:transform .2s}
.wc-dot.l1{background:#c8e6c9}.wc-dot.l2{background:#81c784}.wc-dot.l3{background:#4caf50}
.wc-cell.today .wc-dot{outline:2px solid #FF6B35;outline-offset:1px;transform:scale(1.08)}
.wc-wd{font-size:10px;color:#aaa}
/* ===== 功能按钮 ===== */
.speak-btn,.hint-btn,.theme-btn{display:inline-block;margin:6px 4px 2px;padding:7px 15px;border:none;border-radius:18px;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .2s}
.speak-btn{background:#E3F2FD;color:#1976D2}
.speak-btn:active{background:#BBDEFB;transform:scale(.94)}
.hint-btn{background:#FFF8E1;color:#B26A00}
.hint-btn:active{background:#FFECB3;transform:scale(.94)}
.theme-btn{background:#F3E5F5;color:#7B1FA2}
.theme-btn:active{background:#E1BEE7;transform:scale(.94)}
.hint-reveal{margin:8px 0 0;padding:9px 12px;background:#FFF8E1;color:#8D6E00;border-radius:10px;font-size:13px;font-weight:700;text-align:center;animation:fadeIn .3s ease}
/* ===== 选择页 ===== */
.go-topic-picker{max-width:480px;margin:0 auto;padding:16px}
.go-topic-picker .tp-card{background:#fff;border-radius:20px;box-shadow:0 6px 20px rgba(30,50,100,.08);padding:18px;margin-bottom:14px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:all .2s;border:2px solid transparent}
.go-topic-picker .tp-card:active{transform:scale(.97);border-color:#FF8E53}
.go-topic-picker .tp-ico{font-size:32px;width:56px;height:56px;display:flex;align-items:center;justify-content:center;border-radius:16px;background:#F3E5F5;flex-shrink:0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.05)}
.go-topic-picker h3{font-size:17px;font-weight:800}
.go-topic-picker p{font-size:12.5px;color:#888;margin-top:3px}
/* ===== 阅读卡 ===== */
.reading-box{background:#FFF8E1;border:2px solid #FFE0B2;border-radius:14px;padding:0;margin:8px 0;text-align:left;overflow:hidden}
.rb-head{font-size:13.5px;font-weight:800;color:#B26A00;padding:11px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:rgba(255,224,178,.35)}
.rb-body{font-size:15px;line-height:2;color:#5D4E37;padding:12px 14px;max-height:220px;overflow-y:auto}
/* ===== 围棋棋盘 ===== */
.board{display:inline-grid;gap:1px;background:#DEB887;padding:8px;border-radius:10px;margin:0 auto;box-shadow:0 6px 20px rgba(120,80,30,.25)}
.board.dark{background:#4E342E}
.board.dark .cell-empty{border:1px dashed rgba(255,255,255,0.3)}
.board.dark .go-labels{color:#d7b98c}
.cell{display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:12px;font-weight:700;cursor:pointer}
.cell-black{background:#333;color:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.cell-white{background:#fff;color:#333;border:1px solid #ccc;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.cell-empty{background:transparent;border:1px dashed rgba(0,0,0,0.2)}
.cell-cand{border:2px solid #FF6B35 !important;background:rgba(255,107,53,0.18) !important}
.cand-num{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#FF6B35,#FF8E53);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;box-shadow:0 2px 6px rgba(255,107,53,.4)}
.cell-answer-good{background:#4CAF50 !important;border-color:#4CAF50 !important;animation:bounce .4s}
.cell-answer-bad{background:#F44336 !important;border-color:#F44336 !important;animation:shake .4s}
.go-labels{font-size:11px;color:#a0713e;font-weight:600;display:flex;align-items:center;justify-content:center}
.go-labels-col{display:grid;gap:1px}
.go-labels-row{display:grid;gap:1px}
.go-tip{font-size:12px;color:#888;margin-top:8px;text-align:center}
.star-point{width:7px;height:7px;border-radius:50%;background:rgba(0,0,0,0.55)}
.board.dark .star-point{background:rgba(255,255,255,0.6)}
/* ===== 动画 ===== */
.hidden{display:none}
.fade-in{animation:fadeIn .35s cubic-bezier(.4,0,.2,1)}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%{transform:scale(1)}30%{transform:scale(1.08)}60%{transform:scale(.96)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes popIn{0%{transform:scale(0);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes starPop{0%{transform:scale(0) rotate(-30deg);opacity:0}60%{transform:scale(1.3) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes progressShine{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(90px) rotate(360deg);opacity:0}}
.confetti{position:fixed;font-size:22px;pointer-events:none;z-index:99;animation:confettiFall 1s ease-out forwards}
</style>
</head>
<body>
<div class="header">
<h1>🐻 Peter 学习小助手</h1>
<div class="date" id="dateDisplay"></div>
<div class="streak" id="streakDisplay"></div>
</div>
<div class="nav">
<button class="en-btn" onclick="switchModule('en')">🇬🇧 英语</button>
<button class="zh-btn" onclick="switchModule('zh')">📖 语文</button>
<button class="math-btn" onclick="switchModule('math')">🧮 数学</button>
<button class="go-btn" onclick="switchModule('go')">⚫ 围棋</button>
</div>
<div class="content" id="content">
<div class="question-card" style="text-align:center;padding:40px">
<div style="font-size:48px;margin-bottom:16px">👋</div>
<div style="font-size:18px;font-weight:600;margin-bottom:8px">Peter，你好！</div>
<div style="font-size:14px;color:#888">选择一个科目开始今天的练习吧</div>
</div>
</div>
<script>
function localDate() {
const d = new Date();
return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
const today = localDate();
document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('zh-CN', {year:'numeric',month:'long',day:'numeric',weekday:'long'});
// 头部显示连续打卡
function renderStreak() {
try {
const p = JSON.parse(localStorage.getItem('peter_progress') || '{}');
const n = p.streak || 0;
const el = document.getElementById('streakDisplay');
if (el) el.textContent = n > 0 ? '🔥 已连续打卡 ' + n + ' 天' : '🌟 今天开始打卡吧';
} catch(e) {}
}
renderStreak();

// ===== 语音朗读（浏览器自带 TTS，无需联网）=====
let voiceCn = null, voiceEn = null;
function pickVoices() {
const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
voiceCn = vs.find(v => v.lang && v.lang.toLowerCase().startsWith('zh')) || null;
voiceEn = vs.find(v => v.lang && v.lang.toLowerCase().startsWith('en')) || null;
}
if ('speechSynthesis' in window) {
pickVoices();
speechSynthesis.onvoiceschanged = pickVoices;
}
function speak(text, lang) {
if (!('speechSynthesis' in window) || !text) return;
try {
speechSynthesis.cancel();
const u = new SpeechSynthesisUtterance(text);
u.lang = lang || 'zh-CN';
u.rate = (lang || '').startsWith('zh') ? 0.8 : 0.85;
const v = (lang || '').startsWith('zh') ? voiceCn : voiceEn;
if (v) u.voice = v;
speechSynthesis.speak(u);
} catch(e) {}
}
// 简单答题音效
function playTone(ok) {
try {
const ctx = new (window.AudioContext || window.webkitAudioContext)();
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.connect(gain); gain.connect(ctx.destination);
osc.type = 'sine';
osc.frequency.value = ok ? 880 : 330;
gain.gain.setValueAtTime(0.12, ctx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
osc.start(); osc.stop(ctx.currentTime + 0.22);
setTimeout(() => ctx.close(), 500);
} catch(e) {}
}

// ===== 错题本（间隔重复：错的题优先再出）=====
function loadWrong() { try { return JSON.parse(localStorage.getItem('peter_wrong') || '{}'); } catch(e) { return {}; } }
function saveWrong(w) { try { localStorage.setItem('peter_wrong', JSON.stringify(w)); } catch(e) {} }
function wrongKey(q) {
if (currentModule === 'go') return 'go:' + q.id;
if (currentModule === 'zh') {
if (q.zhSub === 'poems') return 'zp:' + q.poemTitle + ':' + q.question;
if (q.zhSub === 'read') return 'zr:' + q.readTitle + ':' + q.question;
return 'zh:' + q.char;
}
if (currentModule === 'math') return null; // 随机口算题不重样，不进错题本
return 'en:' + q.en;
}
function addWrong(q) {
const k = wrongKey(q);
if (!k) return;
const w = loadWrong();
w[k] = (w[k] || 0) + 1;
saveWrong(w);
}
function clearWrong(q) {
const k = wrongKey(q);
if (!k) return;
const w = loadWrong();
if (w[k]) {
w[k] -= 1;
if (w[k] <= 0) delete w[k];
saveWrong(w);
}
}
// 从错题本取优先题（最多 3 道）
function takeWrongFirst(allQuestions, makeQ) {
const w = loadWrong();
const keys = Object.keys(w).filter(k => w[k] > 0);
if (!keys.length) return { first: [], rest: allQuestions };
const wrongItems = allQuestions.filter(q => wrongKey(q) in w);
const picked = [];
const rest = allQuestions.filter(q => !wrongItems.includes(q));
const pool = shuffle([...wrongItems]);
while (picked.length < 3 && pool.length) picked.push(pool.pop());
return { first: picked, rest };
}

let enData = null, zhData = null, goData = null, poemData = null, readingData = null;
let currentModule = null, currentQ = 0, score = 0, questions = [];
let answered = false;
let lives = 3;          // ❤️ 生命值（Kidjent 式 3 条命）
let autoTimer = null;   // 自动下一题计时器
let combo = 0;          // 🔥 连击数（katrain 训练感）
let zhMode = 'chars';   // 语文子模式：chars识字 / poems诗词 / read阅读
const ZH_MODES = [
	{ id: 'chars', ico: '📖', name: '识字练习', desc: '拼音选字 · 400+ 生字' },
	{ id: 'poems', ico: '📜', name: '诗词背诵', desc: '暑假 9 首必背诗 · 接句/诗意' },
	{ id: 'read', ico: '📚', name: '短文阅读', desc: '6 篇小故事 · 读完答题' },
];
function showZhModePicker() {
	const content = document.getElementById('content');
	let html = '<div class="go-topic-picker fade-in"><div class="q-number" style="margin-bottom:10px">选择语文练习</div>';
	ZH_MODES.forEach(t => {
	html += '<div class="tp-card" onclick="startZhMode(\'' + t.id + '\')">' +
	'<div class="tp-ico" style="background:#FFF3E0">' + t.ico + '</div>' +
	'<div><h3>' + t.name + '</h3><p>' + t.desc + '</p></div></div>';
	});
	html += '</div>';
	content.innerHTML = html;
}
function startZhMode(mode) {
	zhMode = mode;
	currentQ = 0;
	score = 0;
	lives = 3;
	combo = 0;
	clearTimeout(autoTimer);
	questions = generateQuestions('zh');
	showQuestion();
}

// ===== 数学口算题（填空式，Kidjent 风格 + 常见错误干扰项）=====
function genMathQuestion() {
// 难度：0=20以内 1=100以内进退位（轮内前 5 题简单，后 5 题标准）
const hard = currentQ >= 5;
let b, c, ans, text, op, a2, hid;
if (Math.random() < 0.5) {
// 加法 a + b = c
const a = hard ? 11 + Math.floor(Math.random() * 70) : 2 + Math.floor(Math.random() * 16);
b = hard ? 11 + Math.floor(Math.random() * 70) : 2 + Math.floor(Math.random() * 16);
c = a + b;
op = '+';
hid = Math.floor(Math.random() * 3);
if (hid === 0) { text = '__ + ' + b + ' = ' + c; ans = a; }
else if (hid === 1) { text = a + ' + __ = ' + c; ans = b; }
else { text = a + ' + ' + b + ' = __'; ans = c; }
} else {
// 减法 a - b = c（保证 a<=99 且 a>b）
b = hard ? 5 + Math.floor(Math.random() * 45) : 1 + Math.floor(Math.random() * 9);
c = hard ? 5 + Math.floor(Math.random() * 40) : 1 + Math.floor(Math.random() * 15);
a2 = b + c;
op = '-';
hid = Math.floor(Math.random() * 3);
if (hid === 0) { text = '__ - ' + b + ' = ' + c; ans = a2; }
else if (hid === 1) { text = a2 + ' - __ = ' + c; ans = b; }
else { text = a2 + ' - ' + b + ' = __'; ans = c; }
}
// 干扰项：±1/±10/进退位常见错误，保证唯一且 >=0
const wrongs = new Set();
const cands = [ans + 1, ans - 1, ans + 10, ans - 10, ans + 2, ans - 2];
if (hard) cands.push(ans + 9, ans - 9);
for (const c2 of cands) {
if (wrongs.size >= 3) break;
if (c2 !== ans && c2 >= 0 && c2 <= 100) wrongs.add(c2);
}
let filler = 1;
while (wrongs.size < 3) {
const c2 = ans + filler;
if (c2 !== ans && c2 >= 0) wrongs.add(c2);
filler++;
}
const options = shuffle([ans, ...wrongs]);
let full;
if (op === '+') {
full = hid === 0 ? ans + ' + ' + b + ' = ' + c : hid === 1 ? a2 + ' + ' + ans + ' = ' + c : a2 + ' + ' + b + ' = ' + ans;
} else {
full = hid === 0 ? ans + ' - ' + b + ' = ' + c : hid === 1 ? a2 + ' - ' + ans + ' = ' + c : a2 + ' - ' + b + ' = ' + ans;
}
return {
math: true,
question: text,
hint: hard ? '100 以内进退位' : '20 以内口算',
options: options.map(String),
correct: String(ans),
explanation: full
};
}

function shuffle(arr) {
for (let i = arr.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[arr[i], arr[j]] = [arr[j], arr[i]];
}
return arr;
}

function generateQuestions(module) {
	if (module === 'math') {
	return Array.from({length: 10}, () => genMathQuestion());
	}
	if (module === 'en') {
	const allWords = [];
	enData.units.forEach(u => u.words.forEach(w => allWords.push({...w, unit: u.id})));
	const base = allWords.map(w => ({
	en: w.en,
	question: `${w.en}`,
	hint: `选择正确的中文意思`,
	options: shuffle([w.cn, ...w.distractors]),
	correct: w.cn
	}));
	const { first, rest } = takeWrongFirst(base, null);
	const selected = shuffle([...first, ...shuffle(rest).slice(0, 10 - first.length)]);
	return selected;
	} else if (module === 'zh') {
	if (zhMode === 'poems') {
	// 诗词：随机抽 4 首，每首 2 题，接句/诗意/字词
	const qs = [];
	const poems = shuffle([...poemData.poems]).slice(0, 4);
	for (const poem of poems) {
	for (const q of shuffle([...poem.questions]).slice(0, 2)) {
	qs.push({ zhSub: 'poems', poemTitle: poem.title, poemAuthor: poem.author,
	question: q.q, options: shuffle([...q.options]), correct: q.options[q.answer],
	explanation: q.explain, readText: poem.text, readLabel: '《' + poem.title + '》' + poem.author });
	}
	}
	// 补足 10 题
	let i = 0;
	while (qs.length < 10 && i < 5) {
	const poem = poemData.poems[i % poemData.poems.length];
	for (const q of poem.questions) {
	if (qs.length >= 10) break;
	if (!qs.some(x => x.question === q.q)) {
	qs.push({ zhSub: 'poems', poemTitle: poem.title, poemAuthor: poem.author,
	question: q.q, options: shuffle([...q.options]), correct: q.options[q.answer],
	explanation: q.explain, readText: poem.text, readLabel: '《' + poem.title + '》' + poem.author });
	}
	}
	i++;
	}
	return qs.slice(0, 10);
	}
	if (zhMode === 'read') {
	// 阅读：抽 4 篇短文，每篇 2-3 题
	const qs = [];
	const readings = shuffle([...readingData.readings]).slice(0, 4);
	for (const rd of readings) {
	for (const q of rd.questions) {
	qs.push({ zhSub: 'read', readTitle: rd.title,
	question: q.q, options: shuffle([...q.options]), correct: q.options[q.answer],
	explanation: q.explain, readText: rd.text, readLabel: '📖 ' + rd.title });
	}
	}
	return shuffle(qs).slice(0, 10);
	}
	// 识字（默认）
	const allChars = [];
	zhData.categories.forEach(c => c.chars.forEach(ch => allChars.push({...ch, cat: c.id})));
	const base = allChars.map(ch => ({
	char: ch.char,
	question: `${ch.pinyin}`,
	hint: `${ch.stroke}画 · 选择正确的汉字`,
	options: shuffle([ch.char, ...ch.distractors]),
	correct: ch.char,
	meaning: ch.meaning
	}));
	const { first, rest } = takeWrongFirst(base, null);
	const selected = shuffle([...first, ...shuffle(rest).slice(0, 10 - first.length)]);
	return selected;
	} else {
	let pool = goData.puzzles;
	if (goTopic !== 'all') {
	pool = pool.filter(p => GO_THEME_MAP[p.theme] === goTopic);
	}
	const { first, rest } = takeWrongFirst(pool, null);
	const selected = shuffle([...first, ...shuffle(rest)]).slice(0, 10);
	return selected.map(p => {
	const letters = 'ABCDEFGH';
	const correctLabel = letters[p.answer.col] + (p.size - p.answer.row);
	// cells：候选点（含坐标），用于在棋盘上直接点选
	const cells = [{row: p.answer.row, col: p.answer.col, label: correctLabel}];
	while (cells.length < 3) {
	const r = Math.floor(Math.random() * p.size);
	const c = Math.floor(Math.random() * p.size);
	const label = letters[c] + (p.size - r);
	if (!cells.some(o => o.label === label) && p.board[r][c] === '.') {
	cells.push({row: r, col: c, label});
	}
	}
	shuffle(cells);
	return {
	...p,
	question: p.question,
	hint: p.hint,
	cells: cells,
	options: cells.map(o => o.label),
	correct: correctLabel,
	explanation: p.explanation
	};
	});
	}
}

function isStarPoint(sz, r, c) {
	if (sz === 3) return r === 1 && c === 1;
	if (sz === 5) return r === 2 && c === 2;
	if (sz === 7) return (r === 1 || r === 5) && (c === 1 || c === 5);
	return false;
}
// 棋盘主题（kaya 风格）：经典木色 / 深色
function boardTheme() {
try { return localStorage.getItem('peter_board_theme') || 'light'; } catch(e) { return 'light'; }
}
function toggleBoardTheme() {
const next = boardTheme() === 'light' ? 'dark' : 'light';
try { localStorage.setItem('peter_board_theme', next); } catch(e) {}
const board = document.querySelector('.board');
if (board) board.classList.toggle('dark', next === 'dark');
const btn = document.getElementById('themeBtn');
if (btn) btn.textContent = next === 'dark' ? '🎨 浅色棋盘' : '🎨 深色棋盘';
}
function renderBoard(puzzle) {
	const sz = puzzle.size;
	const cellSize = Math.min(36, (300 / sz));
	const letters = 'ABCDEFGH';
	const cells = puzzle.cells || [];
	const darkCls = boardTheme() === 'dark' ? ' dark' : '';
	// 列字母标注（A B C ...）
	let colLabels = '<div class="go-labels" style="grid-template-columns:repeat(' + sz + ',' + cellSize + 'px);grid-column:2;display:grid;gap:1px">';
	for (let c = 0; c < sz; c++) {
	colLabels += '<div class="go-labels">' + letters[c] + '</div>';
	}
	colLabels += '</div>';
	// 行数字标注（size..1）
	let rowLabels = '<div class="go-labels" style="grid-template-rows:repeat(' + sz + ',' + cellSize + 'px);grid-row:2;display:grid;gap:1px">';
	for (let r = 0; r < sz; r++) {
	rowLabels += '<div class="go-labels">' + (sz - r) + '</div>';
	}
	rowLabels += '</div>';

	let html = '<div style="margin:12px auto;display:inline-block">';
	html += '<div style="display:grid;grid-template-columns:' + cellSize + 'px auto;grid-template-rows:' + (cellSize / 2) + 'px auto;gap:0">';
	html += '<div></div>' + colLabels + rowLabels;
	html += '<div class="board' + darkCls + '" style="grid-template-columns:repeat(' + sz + ',' + cellSize + 'px);max-width:' + (sz * cellSize + 16) + 'px">';
	for (let r = 0; r < sz; r++) {
	for (let c = 0; c < sz; c++) {
	const stone = puzzle.board[r][c];
	const cls = stone === 'B' ? 'cell-black' : stone === 'W' ? 'cell-white' : 'cell-empty';
	const candIdx = cells.findIndex(o => o.row === r && o.col === c);
	let inner = stone || '';
	let candCls = '';
	if (candIdx >= 0) {
	candCls = ' cell-cand';
	inner = '<span class="cand-num">' + (candIdx + 1) + '</span>';
	} else if (stone === '.' && isStarPoint(sz, r, c)) {
	// 星位标记（Sabaki/标准棋盘）
	inner = '<span class="star-point"></span>';
	}
	html += '<div class="cell ' + cls + candCls + '" id="gocell-' + r + '-' + c + '" onclick="goCellClick(' + r + ',' + c + ')" style="width:' + cellSize + 'px;height:' + cellSize + 'px">' + inner + '</div>';
	}
	}
	html += '</div></div></div>';
	return html;
}

function goCellClick(r, c) {
	if (answered || currentModule !== 'go') return;
	const q = questions[currentQ];
	const idx = q.cells.findIndex(o => o.row === r && o.col === c);
	if (idx >= 0) checkAnswer(idx);
}

// 答对彩带（多邻国式庆祝）
const CONFETTI_EMOJI = ['⭐', '🌟', '✨', '🎉', '💫'];
function confetti(anchor) {
const rect = (anchor || document.querySelector('.question-card') || document.body).getBoundingClientRect();
const cx = rect.left + rect.width / 2;
const cy = rect.top + rect.height / 2;
for (let i = 0; i < 10; i++) {
const s = document.createElement('span');
s.className = 'confetti';
s.textContent = CONFETTI_EMOJI[i % CONFETTI_EMOJI.length];
s.style.left = (cx + (Math.random() - 0.5) * 180) + 'px';
s.style.top = (cy + (Math.random() - 0.3) * 60) + 'px';
s.style.animationDelay = (Math.random() * 0.25) + 's';
s.style.fontSize = (16 + Math.random() * 14) + 'px';
document.body.appendChild(s);
setTimeout(() => s.remove(), 1400);
}
}

function checkAnswer(idx) {
	if (answered) return;
	answered = true;
	const q = questions[currentQ];
	const opt = document.getElementById('opt-' + idx);
	const isCorrect = q.options[idx] === q.correct;

	if (isCorrect) {
	opt.classList.add('correct');
	score++;
	combo++;
	confetti(opt);
	playTone(true);
	clearWrong(q);
	// 答对：从错题本消掉一次（zh/en 顺便朗读）
	if (currentModule === 'zh' && q.char) speak(q.char, 'zh-CN');
	if (currentModule === 'en' && q.en) speak(q.en, 'en-US');
	} else {
	opt.classList.add('wrong');
	combo = 0;
	playTone(false);
	addWrong(q);
	lives--;
	const livesEl = document.querySelector('.lives');
	if (livesEl) {
	livesEl.innerHTML = [0, 1, 2].map(i => '<span class="' + (i < lives ? '' : 'lost') + '">❤️</span>').join('');
	}
	q.options.forEach((o, i) => {
	if (o === q.correct) {
	document.getElementById('opt-' + i).classList.add('show-correct');
	}
	});
	}

	// 围棋：棋盘上同步反馈（绿色=正确落点，红色=选错）
	if (currentModule === 'go') {
	q.cells.forEach((cell, i) => {
	const el = document.getElementById('gocell-' + cell.row + '-' + cell.col);
	if (el) {
	if (cell.label === q.correct) {
	el.classList.add('cell-answer-good');
	} else if (i === idx) {
	el.classList.add('cell-answer-bad');
	}
	}
	});
	}
	document.getElementById('explanation').classList.remove('hidden');
	document.getElementById('nextBtn').style.display = 'block';
	// ⚡ 自动下一题（Kidjent 式即时节奏）：答对 0.6s，答错 1.8s（围棋看解释留 2.2s）
	clearTimeout(autoTimer);
	const delay = isCorrect ? 600 : (currentModule === 'go' ? 2200 : 1800);
	autoTimer = setTimeout(() => {
	if (lives <= 0) {
	showResults(true);
	} else {
	nextQuestion();
	}
	}, delay);
}

function nextQuestion() {
	clearTimeout(autoTimer);
	currentQ++;
	if (currentQ >= questions.length || lives <= 0) {
	showResults(lives <= 0);
	return;
	}
	showQuestion();
}

// 本周打卡日历（周一~周日，当天练了几科就几级绿）
function weekCalendar() {
const p = JSON.parse(localStorage.getItem('peter_progress') || '{}');
const now = new Date();
const dow = (now.getDay() + 6) % 7; // 周一=0
const monday = new Date(now);
monday.setDate(now.getDate() - dow);
let html = '<div class="week-cal"><div class="wc-title">📅 本周打卡（练得越多越绿）</div><div class="wc-row">';
for (let i = 0; i < 7; i++) {
const d = new Date(monday);
d.setDate(monday.getDate() + i);
const ds = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const day = p[ds] || {};
const mods = Object.keys(day).filter(k => k !== 'streak' && k !== 'lastDate').length;
const lvl = mods === 0 ? '' : mods === 1 ? 'l1' : mods === 2 ? 'l2' : 'l3';
const isToday = ds === today;
const wd = ['一', '二', '三', '四', '五', '六', '日'][i];
html += '<div class="wc-cell' + (isToday ? ' today' : '') + '"><div class="wc-dot ' + lvl + '"></div><div class="wc-wd">' + wd + '</div></div>';
}
html += '</div></div>';
return html;
}

function showResults(early) {
const content = document.getElementById('content');
const total = questions.length || 10;
const pct = total ? score / total : 0;
const emoji = early ? '💔' : pct >= 0.9 ? '🏆' : pct >= 0.7 ? '⭐' : pct >= 0.5 ? '👍' : '💪';
const msg = early ? '生命耗尽！下次小心点' : pct >= 0.9 ? '太棒了！完美！' : pct >= 0.7 ? '不错！继续加油！' : pct >= 0.5 ? '还可以，再练练！' : '没关系，明天继续！';

// 星级：≥90% 三星，≥70% 两星，≥50% 一星
const stars = pct >= 0.9 ? 3 : pct >= 0.7 ? 2 : pct >= 0.5 ? 1 : 0;
const starHtml = Array.from({length: 3}, (_, i) => '<span class="star" style="animation-delay:' + (0.2 + i * 0.18) + 's">' + (i < stars ? '★' : '☆') + '</span>').join('');

// 记录成绩 + 连续打卡
const progress = JSON.parse(localStorage.getItem('peter_progress') || '{}');
if (!progress[today]) progress[today] = {};
progress[today][currentModule] = score;
const last = progress.lastDate || '';
if (last !== today) {
const y = new Date(Date.now() - 86400000);
const yesterday = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');
progress.streak = (last === yesterday ? (progress.streak || 0) : 0) + 1;
progress.lastDate = today;
}
localStorage.setItem('peter_progress', JSON.stringify(progress));
renderStreak();

// 本轮错题数（提示进了错题本）
const wrongMap = loadWrong();
const wrongCount = questions.filter(q => wrongMap[wrongKey(q)] > 0).length;
const wrongNote = wrongCount > 0 ? `<div class="score-sub">📒 有 ${wrongCount} 题进了错题本，下次练习会优先出现</div>` : '';
const livesLeft = lives > 0 ? `<div class="score-sub">❤️ 还剩 ${lives} 条命</div>` : '';

content.innerHTML = `
<div class="fade-in">
<div class="score-card">
<div class="score-emoji">${emoji}</div>
<div class="score-stars">${starHtml}</div>
<div class="score-text">${score} / ${total}</div>
<div class="score-msg">${msg}</div>
<div class="score-sub">🔥 已连续打卡 ${progress.streak || 0} 天</div>
${livesLeft}
${weekCalendar()}
${wrongNote}
<button class="restart-btn" onclick="switchModule('${currentModule}')">再来一局</button>
</div>
</div>
`;
}

function switchModule(module) {
	currentModule = module;
	currentQ = 0;
	score = 0;
	lives = 3;
	combo = 0;
	clearTimeout(autoTimer);
	document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
	document.querySelector(`.nav .${module}-btn`).classList.add('active');
	if (module === 'go') {
	// 围棋专项训练：先选主题（katrain 风格）
	showGoTopicPicker();
	return;
	}
	if (module === 'zh') {
	// 语文：识字/诗词/阅读 三选一
	showZhModePicker();
	return;
	}
	questions = generateQuestions(module);
	showQuestion();
}

function toggleReading() {
	const box = document.getElementById('readingBox');
	if (!box) return;
	const body = box.querySelector('.rb-body');
	const arrow = box.querySelector('.rb-arrow');
	if (body) {
	const open = body.style.display !== 'none';
	body.style.display = open ? 'none' : 'block';
	if (arrow) arrow.textContent = open ? '▼' : '▲';
	}
}

loadData();
</script>
</body>
</html>
